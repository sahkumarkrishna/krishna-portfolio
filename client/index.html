<!doctype html>
<html lang="en">
  <head>
    <!-- ✅ Basic Setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Title (Most Important SEO Tag) -->
    <title>Krishna Kumar - Full Stack Developer Portfolio</title>

    <meta
      name="description"
      content="Krishna Kumar - Full Stack Developer Portfolio showcasing modern MERN stack applications built with React, Node.js, Express, and MongoDB."
    />

    <meta name="author" content="Krishna Kumar" />

    <!-- ✅ Robots -->
    <meta name="robots" content="index, follow" />

    <!-- ✅ Canonical URL -->
    <link
      rel="canonical"
      href="https://krishna-portfolio-fbv8.vercel.app/"
    />

    <!-- ✅ Theme Color (Mobile Browser UI Color) -->
    <meta name="theme-color" content="#3b82f6" />

      property="og:description"
      content="Passionate Full Stack Developer crafting modern web applications using React, Node.js, and MERN Stack."
    />

    <meta
      property="og:url"
      content="https://krishna-portfolio-fbv8.vercel.app"
